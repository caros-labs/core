name: Rust

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
        with:
          path: core
      - uses: actions/checkout@v4
        with:
          repository: caros-labs/sdk
          # Exact SDK revision tested with this Core API.
          ref: b958097a916f8fbc20f36589a7a297db69629148
          path: sdk
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Lint
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +stable test --locked --all-targets

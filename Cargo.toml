[package]
name = "caros-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
libc = "0.2"
tokio = { version = "1", features = ["macros", "rt", "signal", "time", "net", "io-util", "sync", "process"] }

caros-protocol = { path = "../sdk/crates/caros-protocol", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
caros-sdk = { path = "../sdk/crates/caros-sdk", version = "0.1.0" }
